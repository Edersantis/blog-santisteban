[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # El build de Netlify no envía telemetría de Astro.
  ASTRO_TELEMETRY_DISABLED = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Páginas que ya no existen: el inicio es el blog.
[[redirects]]
  from = "https://blog-santisteban.netlify.app/*"
  to = "https://blog.santisteban.co/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/blog"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/acerca"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/acerca/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about/"
  to = "/"
  status = 301
  force = true

# Conserva los enlaces a la primera entrada de muestra.
[[redirects]]
  from = "/blog/ejemplo-decision/"
  to = "/blog/tres-decisiones-proyecto-ia/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/ejemplo-decision"
  to = "/blog/tres-decisiones-proyecto-ia/"
  status = 301
  force = true
